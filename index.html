<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>报工助手</title>
    <style>
        /* ===== 全局重置 & 移动端优先 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f2f6fc;
            color: #1a2639;
            padding: 8px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-size: 16px;
        }

        input,
        select,
        button {
            font-size: 16px !important;
        }

        .app-container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            padding: 16px 14px 24px;
            margin: 0 auto;
        }

        /* ===== 顶部 ===== */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 12px;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 14px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-brand .logo {
            width: 38px;
            height: 38px;
            background: #2a6df4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .app-brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0b1a33;
        }
        .app-brand h1 span {
            color: #2a6df4;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 4px;
        }

        /* ===== 按钮系统 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            min-height: 44px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            background: #eef2f7;
            color: #1a2639;
            white-space: nowrap;
            flex: 1 1 auto;
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .btn-primary {
            background: #2a6df4;
            color: #fff;
            box-shadow: 0 4px 10px rgba(42, 109, 244, 0.2);
        }
        .btn-primary:active {
            background: #1a5ad9;
        }

        .btn-success {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2);
        }
        .btn-success:active {
            background: #15803d;
        }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .btn-danger:active {
            background: #b91c1c;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #d0d9e8;
        }
        .btn-outline:active {
            border-color: #2a6df4;
            background: #f0f5ff;
        }

        .btn-sm {
            padding: 6px 12px;
            min-height: 34px;
            font-size: 13px;
            border-radius: 8px;
        }

        .btn-jump {
            background: #8b5cf6;
            color: #fff;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.25);
        }
        .btn-jump:active {
            background: #7c3aed;
        }

        .btn-block {
            flex: 1 1 100%;
            width: 100%;
        }

        /* ===== Tab 导航 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            background: #eef2f7;
            padding: 4px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #5b6e8a;
            min-height: 44px;
            text-align: center;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0b1a33;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tab-panel {
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .tab-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 分段控制器 ===== */
        .segment-control {
            display: flex;
            background: #eef2f7;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .segment-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            background: transparent;
            color: #5b6e8a;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 40px;
        }

        .segment-btn.active {
            background: #ffffff;
            color: #0b1a33;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* ===== 表单 ===== */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8faff;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e6edf6;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #3d5470;
            padding-left: 4px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            min-height: 48px;
            border: 1.5px solid #d9e2ef;
            border-radius: 12px;
            background: #fff;
            transition: border 0.2s;
            outline: none;
            width: 100%;
            color: #0b1a33;
            appearance: auto;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 4px rgba(42, 109, 244, 0.10);
        }

        .form-actions {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            margin-top: 4px;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* ===== 型号列表 ===== */
        .model-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .model-card {
            background: #f8faff;
            border: 1px solid #e6edf6;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .model-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .model-name {
            font-weight: 600;
            font-size: 16px;
            color: #0b1a33;
        }

        .model-duration {
            font-size: 14px;
            color: #5b6e8a;
        }
        .model-duration strong {
            color: #2a6df4;
        }

        .model-actions .btn {
            min-height: 34px;
            padding: 4px 14px;
            font-size: 13px;
        }

        /* ===== 工件卡片（紧凑版） ===== */
        .records-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        .record-card {
            background: #ffffff;
            border: 1.5px solid #e6edf6;
            border-radius: 16px;
            padding: 14px 16px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .record-card.compact {
            padding: 12px 14px;
        }

        .record-card .status-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .status-waiting {
            background: #eef2f7;
            color: #5b6e8a;
        }
        .status-ready {
            background: #d1fae5;
            color: #065f46;
            animation: pulse-green 1.8s infinite;
        }
        .status-overdue {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-done {
            background: #e0e7ff;
            color: #3730a3;
        }

        @keyframes pulse-green {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .record-header-compact {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .record-model {
            font-size: 17px;
            font-weight: 700;
            color: #0b1a33;
        }

        .record-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #5b6e8a;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .record-number {
            font-size: 28px;
            font-weight: 800;
            color: #2a6df4;
            background: #eef4ff;
            padding: 6px 16px;
            border-radius: 10px;
            display: inline-block;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(42, 109, 244, 0.15);
        }

        .record-deadline {
            font-weight: 600;
            color: #2a6df4;
            background: #eef4ff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }

        .record-countdown {
            display: flex;
            justify-content: center;
            margin: 6px 0 10px 0;
        }

        .countdown-large {
            font-size: 20px;
            font-weight: 700;
            background: #f0f5ff;
            padding: 6px 18px;
            border-radius: 30px;
            color: #2a6df4;
            letter-spacing: 0.5px;
        }

        .countdown-large.overdue {
            color: #dc2626;
            background: #fee2e2;
        }
        .countdown-large.ready {
            color: #16a34a;
            background: #d1fae5;
        }

        .record-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .record-actions .btn {
            flex: 1;
            min-height: 36px;
            font-size: 14px;
            padding: 4px 8px;
        }

        .record-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e0e6ef;
            display: none;
        }

        .record-details.open {
            display: block;
        }

        .record-details .row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 14px;
        }

        .record-details .label {
            color: #5b6e8a;
            font-weight: 500;
        }
        .record-details .value {
            font-weight: 600;
        }
        .record-details .value.highlight {
            color: #2a6df4;
        }

        .record-card.done-card {
            padding: 16px;
        }

        .record-card.done-card .record-header {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 10px;
        }

        .record-card.done-card .record-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 15px;
        }

        .record-card.done-card .record-body .row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }

        .record-card.done-card .record-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eef2f7;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #7f94b0;
        }
        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 15px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 400px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.20);
            animation: fadeUp 0.25s ease;
        }

        .modal h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #0b1a33;
        }
        .modal p {
            color: #5b6e8a;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .modal .form-group {
            flex: 1 1 100%;
        }

        .modal .form-actions {
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal .form-actions .btn {
            flex: 1;
            min-height: 48px;
        }

        /* ===== 可报工提醒弹窗 ===== */
        #readyPopup .modal {
            animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-top: 4px solid #16a34a;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .ready-popup-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 46vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 2px;
            margin-bottom: 4px;
        }

        .ready-popup-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            background: #f8faff;
            border: 1.5px solid #e6edf6;
            border-radius: 14px;
            border-left: 4px solid #16a34a;
        }

        .ready-popup-item.overdue-item {
            border-left-color: #dc2626;
        }

        .ready-popup-item .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .ready-popup-item .item-number {
            font-size: 22px;
            font-weight: 800;
            color: #2a6df4;
            letter-spacing: 0.5px;
            word-break: break-all;
            line-height: 1.2;
        }

        .ready-popup-item .item-number .hash {
            color: #16a34a;
        }

        .ready-popup-item.overdue-item .item-number .hash {
            color: #dc2626;
        }

        .ready-popup-item .item-model {
            font-size: 13px;
            color: #5b6e8a;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ready-popup-item .mini-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
        }

        .ready-popup-item .btn {
            flex: 0 0 auto;
            min-height: 36px;
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 10px;
        }

        /* 一键全报按钮（高亮） */
        .btn-batch-all {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            min-height: 52px;
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
            letter-spacing: 0.3px;
        }
        .btn-batch-all:active {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            transform: scale(0.97);
        }

        /* ===== 设置项辅助样式 ===== */
        .setting-block {
            margin-bottom: 20px;
        }

        .field-hint {
            font-size: 12.5px;
            color: #7f94b0;
            line-height: 1.5;
            padding: 2px 4px 0;
        }

        .preset-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-left: 4px;
        }

        .chip {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid #d9e2ef;
            background: #fff;
            color: #3d5470;
            font-size: 13px !important;
            font-weight: 600;
            cursor: pointer;
            min-height: 32px;
            transition: all 0.15s;
            flex: 0 0 auto;
        }

        .chip:active {
            transform: scale(0.95);
        }

        .chip.active {
            background: #2a6df4;
            border-color: #2a6df4;
            color: #fff;
        }

        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-unit input {
            padding-right: 44px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 16px;
            color: #7f94b0;
            font-weight: 600;
            font-size: 15px;
            pointer-events: none;
        }

        /* ===== 桌面适配 ===== */
        @media (min-width: 640px) {
            body {
                padding: 20px;
            }
            .app-container {
                max-width: 720px;
                padding: 28px 32px;
            }
            .header-actions {
                width: auto;
                margin-top: 0;
            }
            .header-actions .btn {
                flex: 0 1 auto;
            }
            .form-row {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-end;
            }
            .form-group {
                flex: 1 1 180px;
            }
            .form-actions {
                flex: 0 1 auto;
                width: auto;
            }
            .records-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px;
            }
            .model-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 960px;
            }
            .records-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .text-muted {
            color: #7f94b0;
            font-size: 14px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }

        .btn-toggle .arrow {
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn-toggle .arrow.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- ===== 顶部 ===== -->
        <header class="app-header">
            <div class="app-brand">
                <div class="logo">⏱</div>
                <h1>报工<span>助手</span></h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-jump btn-sm" onclick="quickJump()">🚀 一键跳转</button>
                <button class="btn btn-outline btn-sm" onclick="openSettingsModal()">⚙️ 设置</button>
            </div>
        </header>

        <!-- ===== Tab 导航 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-main">📋 报工计时</button>
            <button class="tab-btn" data-tab="tab-models">📦 型号管理</button>
        </div>

        <!-- ========================================================= -->
        <!-- TAB 1: 主界面 -->
        <!-- ========================================================= -->
        <div class="tab-panel active" id="tab-main">
            <!-- 开工表单 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="modelSelect">选择型号</label>
                    <select id="modelSelect">
                        <option value="">— 请先添加型号 —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="workNumber">工件编号（可选）</label>
                    <input type="text" id="workNumber" placeholder="例如：0001" />
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="startWork()">▶ 开工</button>
                    <button class="btn btn-outline btn-sm" onclick="clearAllRecords()" style="color:#b91c1c;flex:0.5;">清空</button>
                </div>
            </div>

            <!-- 分段控制 -->
            <div class="segment-control">
                <button class="segment-btn active" data-view="active" onclick="switchView('active')">⏳ 进行中</button>
                <button class="segment-btn" data-view="done" onclick="switchView('done')">✅ 已报工</button>
            </div>

            <div class="flex-between" style="margin-bottom:10px;">
                <h2 style="font-size:17px;font-weight:600;color:#0b1a33;" id="listTitle">⏳ 进行中的工件</h2>
                <span class="text-muted" id="recordCount">共 0 个</span>
            </div>

            <div id="recordsContainer">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p id="emptyText">暂无进行中的工件，选择型号后点击「开工」开始计时</p>
                </div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- TAB 2: 型号管理 -->
        <!-- ========================================================= -->
        <div class="tab-panel" id="tab-models">
            <div class="form-row">
                <div class="form-group">
                    <label for="modelNameInput">型号名称</label>
                    <input type="text" id="modelNameInput" placeholder="例如: 型号A" />
                </div>
                <div class="form-group">
                    <label for="modelDurationInput">工时（分钟）</label>
                    <input type="number" id="modelDurationInput" placeholder="120" min="1" />
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" onclick="addModel()">➕ 添加</button>
                </div>
            </div>

            <h2 style="font-size:17px;font-weight:600;color:#0b1a33;margin-bottom:10px;">📋 型号列表</h2>
            <div id="modelsContainer">
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <p>暂无型号，请添加</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 设置弹窗 ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ 设置</h3>
            <p>配置报工窗口浮动比例与跳转地址</p>

            <!-- 报工窗口浮动比例 -->
            <div class="form-group setting-block">
                <label for="windowPercentInput">报工窗口浮动比例（上下各浮动）</label>
                <div class="input-with-unit">
                    <input type="number" id="windowPercentInput" min="0" max="100" step="1" placeholder="20" />
                    <span class="unit">%</span>
                </div>
                <span class="field-hint">
                    以工时为中心，前后各浮动该比例。<br />
                    例：工时 100 分钟、浮动 20% → 最早第 80 分钟、最晚第 120 分钟可报工。
                </span>
                <div class="preset-chips" id="percentPresets">
                    <button type="button" class="chip" data-pct="5" onclick="setPercentPreset(5)">5%</button>
                    <button type="button" class="chip" data-pct="10" onclick="setPercentPreset(10)">10%</button>
                    <button type="button" class="chip" data-pct="20" onclick="setPercentPreset(20)">20%</button>
                    <button type="button" class="chip" data-pct="30" onclick="setPercentPreset(30)">30%</button>
                    <button type="button" class="chip" data-pct="50" onclick="setPercentPreset(50)">50%</button>
                </div>
            </div>

            <!-- 跳转地址 -->
            <div class="form-group setting-block">
                <label for="jumpUrlInput">跳转地址</label>
                <input type="text" id="jumpUrlInput" placeholder="例如: welink:// 或 https://..." />
                <span class="field-hint">报工成功后自动跳转的地址（URL Scheme 或 网页链接）</span>
            </div>

            <div class="form-actions">
                <button class="btn btn-outline" onclick="closeSettingsModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <!-- ===== 可报工自动提醒弹窗 ===== -->
    <div class="modal-overlay" id="readyPopup">
        <div class="modal">
            <h3 id="readyPopupTitle">⏰ 有工件可以报工啦</h3>
            <p>以下工件已进入报工时间窗口，请及时报工</p>
            <div id="readyPopupList" class="ready-popup-list"></div>
            <div class="form-actions" style="flex-direction:column;gap:10px;">
                <button class="btn btn-success btn-block btn-batch-all" onclick="batchFinishAll()">
                    ✅ 一键全报（全部标记为已报工并跳转）
                </button>
                <button class="btn btn-outline btn-block" onclick="closeReadyPopup()">稍后再说</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据层
        // ================================================================

        const STORAGE_KEY_MODELS = 'worktime_models';
        const STORAGE_KEY_RECORDS = 'worktime_records';
        const STORAGE_KEY_JUMP_URL = 'worktime_jump_url';
        const STORAGE_KEY_WINDOW_PERCENT = 'worktime_window_percent';

        const DEFAULT_WINDOW_PERCENT = 20;   // 默认上下浮动 20%

        let models = [];
        let records = [];
        let jumpUrl = '';
        let windowPercent = DEFAULT_WINDOW_PERCENT;   // 报工窗口浮动比例（%）
        let currentView = 'active';
        let expanded = {};

        // 已弹窗提醒过的记录 ID（内存级去重，避免同一秒内反复弹窗）
        let notifiedIds = new Set();

        function loadData() {
            try {
                const m = localStorage.getItem(STORAGE_KEY_MODELS);
                models = m ? JSON.parse(m) : [];
            } catch { models = []; }

            try {
                const r = localStorage.getItem(STORAGE_KEY_RECORDS);
                records = r ? JSON.parse(r) : [];
            } catch { records = []; }

            jumpUrl = localStorage.getItem(STORAGE_KEY_JUMP_URL) || '';

            // 读取浮动比例并做合法性校验
            const pctRaw = localStorage.getItem(STORAGE_KEY_WINDOW_PERCENT);
            const pct = parseFloat(pctRaw);
            windowPercent = (pctRaw !== null && !isNaN(pct) && pct >= 0 && pct <= 100)
                ? pct
                : DEFAULT_WINDOW_PERCENT;

            // 回填到设置面板
            document.getElementById('jumpUrlInput').value = jumpUrl;
            document.getElementById('windowPercentInput').value = windowPercent;
            syncPresetChips();
        }

        function saveModels() {
            localStorage.setItem(STORAGE_KEY_MODELS, JSON.stringify(models));
        }

        function saveRecords() {
            localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
        }

        // ===== 统一保存设置（跳转地址 + 浮动比例） =====
        function saveSettings() {
            const urlVal = document.getElementById('jumpUrlInput').value.trim();
            const pctRaw = document.getElementById('windowPercentInput').value.trim();
            const pctVal = parseFloat(pctRaw);

            if (pctRaw === '' || isNaN(pctVal)) {
                alert('⚠️ 请输入报工窗口浮动比例');
                return;
            }
            if (pctVal < 0 || pctVal > 100) {
                alert('⚠️ 浮动比例请在 0 ~ 100 之间');
                return;
            }

            jumpUrl = urlVal;
            windowPercent = pctVal;

            localStorage.setItem(STORAGE_KEY_JUMP_URL, jumpUrl);
            localStorage.setItem(STORAGE_KEY_WINDOW_PERCENT, String(windowPercent));

            // 比例变化后，重新评估哪些工件现在可以报工
            notifiedIds.clear();

            closeSettingsModal();
            renderRecords();
            checkAndShowReadyPopup(false);
            alert(`✅ 设置已保存\n报工窗口：工时前后各浮动 ${windowPercent}%`);
        }

        // ===== 快捷预设 =====
        function setPercentPreset(pct) {
            document.getElementById('windowPercentInput').value = pct;
            syncPresetChips();
        }

        function syncPresetChips() {
            const current = parseFloat(document.getElementById('windowPercentInput').value);
            document.querySelectorAll('#percentPresets .chip').forEach(chip => {
                const pct = parseFloat(chip.dataset.pct);
                chip.classList.toggle('active', !isNaN(current) && pct === current);
            });
        }

        // ================================================================
        //  核心：一键跳转（顶部按钮）
        // ================================================================

        function quickJump() {
            if (!jumpUrl) {
                alert('⚠️ 请先点击「设置」配置跳转地址');
                openSettingsModal();
                return;
            }
            window.location.href = jumpUrl;
        }

        // ================================================================
        //  视图切换
        // ================================================================

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.segment-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            renderRecords();
        }

        // ================================================================
        //  型号管理
        // ================================================================

        function addModel() {
            const nameInput = document.getElementById('modelNameInput');
            const durInput = document.getElementById('modelDurationInput');
            const name = nameInput.value.trim();
            const dur = parseInt(durInput.value);

            if (!name) { alert('请输入型号名称'); return; }
            if (!dur || dur < 1) { alert('请输入有效的工时（分钟）'); return; }

            if (models.some(m => m.name === name)) {
                alert('该型号已存在，请勿重复添加');
                return;
            }

            models.push({
                id: Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
                name: name,
                duration: dur
            });

            saveModels();
            nameInput.value = '';
            durInput.value = '';
            renderModels();
            renderModelSelect();
        }

        function deleteModel(id) {
            if (!confirm('确定要删除该型号吗？')) return;
            models = models.filter(m => m.id !== id);
            saveModels();
            renderModels();
            renderModelSelect();
            renderRecords();
        }

        // ================================================================
        //  主界面 - 开工 & 记录管理
        // ================================================================

        function startWork() {
            const select = document.getElementById('modelSelect');
            const modelId = select.value;
            const number = document.getElementById('workNumber').value.trim();

            if (!modelId) {
                alert('请先选择一个型号');
                return;
            }

            const model = models.find(m => m.id === modelId);
            if (!model) {
                alert('所选型号不存在，请重新选择');
                renderModelSelect();
                return;
            }

            const now = new Date();
            const record = {
                id: Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
                modelId: model.id,
                modelName: model.name,
                duration: model.duration,
                number: number || '',
                startTime: now.toISOString(),
                done: false,
                finishTime: null
            };

            records.push(record);
            saveRecords();
            document.getElementById('workNumber').value = '';
            renderRecords();
            renderModelSelect();
        }

        // ===== 单个报工：标记完成 + 自动跳转 =====
        function finishWork(id) {
            const record = records.find(r => r.id === id);
            if (!record || record.done) return;

            // 1. 标记为已报工
            record.done = true;
            record.finishTime = new Date().toISOString();
            saveRecords();

            // 2. 从提醒列表移除
            notifiedIds.delete(id);

            // 3. 刷新视图
            renderRecords();

            // 4. 自动跳转到配置的地址
            if (jumpUrl) {
                window.location.href = jumpUrl;
            } else {
                alert('⚠️ 请先在「设置」中配置跳转地址');
                openSettingsModal();
            }
        }

        // ===== ★ 一键全报：所有可报工工件一次性标记完成 + 跳转 =====
        function batchFinishAll() {
            const readyList = getReadyRecords();

            if (readyList.length === 0) {
                closeReadyPopup();
                return;
            }

            const count = readyList.length;
            const nowIso = new Date().toISOString();

            // 批量标记为已报工
            readyList.forEach(r => {
                r.done = true;
                r.finishTime = nowIso;
                notifiedIds.delete(r.id);
            });

            saveRecords();
            closeReadyPopup();
            renderRecords();

            // 跳转（延迟一点点让界面先更新）
            if (jumpUrl) {
                setTimeout(() => {
                    window.location.href = jumpUrl;
                }, 120);
            } else {
                alert(`✅ 已批量报工 ${count} 个工件\n⚠️ 但未配置跳转地址，请先在「设置」中配置`);
                openSettingsModal();
            }
        }

        function deleteRecord(id) {
            if (!confirm('确定要移除该记录吗？')) return;
            records = records.filter(r => r.id !== id);
            delete expanded[id];
            notifiedIds.delete(id);
            saveRecords();
            renderRecords();
        }

        function clearAllRecords() {
            const active = records.filter(r => !r.done);
            if (active.length === 0) {
                alert('没有进行中的工件');
                return;
            }
            if (!confirm(`确定要清空全部 ${active.length} 个进行中的工件吗？`)) return;
            records = records.filter(r => r.done);
            saveRecords();
            expanded = {};
            notifiedIds.clear();
            renderRecords();
        }

        function toggleDetails(id) {
            expanded[id] = !expanded[id];
            renderRecords();
        }

        // ================================================================
        //  可报工自动提醒
        // ================================================================

        /**
         * 获取当前所有状态为「可报工」或「已超时」的进行中工件
         */
        function getReadyRecords() {
            const now = Date.now();
            return records
                .filter(r => {
                    if (r.done) return false;
                    const start = new Date(r.startTime).getTime();
                    const { windowStart, windowEnd } = calcReportWindow(start, r.duration);
                    const st = getStatus(now, windowStart, windowEnd);
                    return st === 'ready' || st === 'overdue';
                })
                .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
        }

        /**
         * 检查并弹出提醒
         * @param {boolean} force 为 true 时忽略去重标记（用于页面加载、设置变更）
         */
        function checkAndShowReadyPopup(force) {
            const readyList = getReadyRecords();
            if (readyList.length === 0) return;

            // 自动检查时，若没有「新」的可报工工件，就不打扰
            if (!force) {
                const hasNew = readyList.some(r => !notifiedIds.has(r.id));
                if (!hasNew) return;
            }

            // 标记为已提醒
            readyList.forEach(r => notifiedIds.add(r.id));
            showReadyPopup(readyList);
        }

        /**
         * 渲染并显示提醒弹窗
         */
        function showReadyPopup(list) {
            const container = document.getElementById('readyPopupList');
            const titleEl = document.getElementById('readyPopupTitle');
            const now = Date.now();

            // 标题显示数量
            titleEl.textContent = `⏰ 有 ${list.length} 个工件可以报工啦`;

            container.innerHTML = list.map(r => {
                const start = new Date(r.startTime).getTime();
                const { windowStart, windowEnd } = calcReportWindow(start, r.duration);
                const status = getStatus(now, windowStart, windowEnd);
                const isOverdue = status === 'overdue';
                const tagText = isOverdue ? '⚠️ 已超时' : '✅ 可报工';
                const tagCls = isOverdue ? 'status-overdue' : 'status-ready';
                const numberText = r.number && r.number.trim() ? escapeHtml(r.number.trim()) : '无编号';
                const modelText = escapeHtml(r.modelName || '（已删除）');

                return `
                    <div class="ready-popup-item ${isOverdue ? 'overdue-item' : ''}">
                        <div class="info">
                            <span class="item-number"><span class="hash">#</span>${numberText}</span>
                            <span class="item-model">
                                ${modelText}
                                <span class="mini-tag ${tagCls}">${tagText}</span>
                            </span>
                        </div>
                        <button class="btn btn-success btn-sm" onclick="finishWorkFromPopup('${r.id}')">报工</button>
                    </div>
                `;
            }).join('');

            document.getElementById('readyPopup').classList.add('open');
        }

        function closeReadyPopup() {
            document.getElementById('readyPopup').classList.remove('open');
        }

        /**
         * 从提醒弹窗中直接报工（单个）
         */
        function finishWorkFromPopup(id) {
            closeReadyPopup();
            finishWork(id);
        }

        // ================================================================
        //  渲染
        // ================================================================

        function renderModelSelect() {
            const select = document.getElementById('modelSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="">— 请选择型号 —</option>';
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.name}（${m.duration}分钟）`;
                select.appendChild(opt);
            });
            if (currentVal && models.some(m => m.id === currentVal)) {
                select.value = currentVal;
            }
        }

        function renderModels() {
            const container = document.getElementById('modelsContainer');
            if (models.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <p>暂无型号，请添加</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="model-list">';
            models.forEach(m => {
                html += `
                    <div class="model-card">
                        <div class="model-info">
                            <span class="model-name">${escapeHtml(m.name)}</span>
                            <span class="model-duration">⏱ <strong>${m.duration}</strong> 分钟</span>
                        </div>
                        <div class="model-actions">
                            <button class="btn btn-danger btn-sm" onclick="deleteModel('${m.id}')">删除</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            const countEl = document.getElementById('recordCount');
            const titleEl = document.getElementById('listTitle');
            const emptyTextEl = document.getElementById('emptyText');

            let list = [];
            let title = '';
            let emptyMsg = '';

            if (currentView === 'active') {
                list = records.filter(r => !r.done).sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
                title = '⏳ 进行中的工件';
                emptyMsg = '暂无进行中的工件，选择型号后点击「开工」开始计时';
            } else {
                list = records.filter(r => r.done).sort((a, b) => new Date(b.finishTime) - new Date(a.finishTime));
                title = '✅ 已报工的工件';
                emptyMsg = '暂无已报工记录';
            }

            titleEl.textContent = title;
            countEl.textContent = `共 ${list.length} 个`;

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>${emptyMsg}</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="records-grid">';
            const now = Date.now();

            list.forEach(r => {
                const start = new Date(r.startTime).getTime();

                // ★ 使用可配置的浮动比例计算报工窗口
                const { windowStart, windowEnd } = calcReportWindow(start, r.duration);

                const modelDisplay = escapeHtml(r.modelName || '（已删除）');
                const activeNumberDisplay = r.number ? '编号' + escapeHtml(r.number) : '（无编号）';
                const doneNumberDisplay = r.number ? '#' + escapeHtml(r.number) : '（无编号）';

                if (!r.done) {
                    const status = getStatus(now, windowStart, windowEnd);
                    const statusMap = {
                        waiting: { label: '⏳ 等待报工', cls: 'status-waiting' },
                        ready: { label: '✅ 可报工', cls: 'status-ready' },
                        overdue: { label: '⚠️ 已超时', cls: 'status-overdue' }
                    };
                    const statusLabel = statusMap[status].label;
                    const statusClass = statusMap[status].cls;

                    let countdownText = '';
                    let countdownClass = '';
                    if (status === 'waiting') {
                        const remain = windowStart - now;
                        if (remain > 0) {
                            countdownText = `⏳ ${formatDuration(remain)} 后可报`;
                        } else {
                            countdownText = '即将可报工';
                            countdownClass = 'ready';
                        }
                    } else if (status === 'ready') {
                        const remain = windowEnd - now;
                        countdownText = `✅ 可报（剩 ${formatDuration(remain)}）`;
                        countdownClass = 'ready';
                    } else {
                        const over = now - windowEnd;
                        countdownText = `⏰ 超时 ${formatDuration(over)}`;
                        countdownClass = 'overdue';
                    }

                    const isExpanded = expanded[r.id] || false;
                    const detailsDisplay = isExpanded ? 'open' : '';
                    const deadlineStr = formatTime(windowEnd);

                    html += `
                        <div class="record-card compact" data-id="${r.id}">
                            <div class="record-header-compact">
                                <span class="record-model">${modelDisplay}</span>
                                <span class="status-badge ${statusClass}">${statusLabel}</span>
                            </div>
                            <div class="record-sub">
                                <span class="record-number">${activeNumberDisplay}</span>
                                <span class="record-deadline">⏰ 最晚 ${deadlineStr}</span>
                            </div>
                            <div class="record-countdown">
                                <span class="countdown-large ${countdownClass}">${countdownText}</span>
                            </div>
                            <div class="record-actions">
                                <button class="btn btn-outline btn-sm btn-toggle" onclick="toggleDetails('${r.id}')">
                                    <span class="arrow ${isExpanded ? 'open' : ''}">▼</span> 详情
                                </button>
                                ${(status === 'ready' || status === 'overdue') ? `
                                    <button class="btn btn-success btn-sm" onclick="finishWork('${r.id}')">✅ 报工</button>
                                ` : `
                                    <button class="btn btn-outline btn-sm" disabled style="opacity:0.5;">⏳ 等待</button>
                                `}
                                <button class="btn btn-danger btn-sm" onclick="deleteRecord('${r.id}')">🗑</button>
                            </div>
                            <div class="record-details ${detailsDisplay}">
                                <div class="row">
                                    <span class="label">开工时间</span>
                                    <span class="value">${formatTime(start)}</span>
                                </div>
                                <div class="row">
                                    <span class="label">报工窗口</span>
                                    <span class="value highlight">${formatTime(windowStart)} ~ ${formatTime(windowEnd)}</span>
                                </div>
                                <div class="row">
                                    <span class="label">浮动比例</span>
                                    <span class="value">±${formatPercent(windowPercent)}</span>
                                </div>
                                <div class="row">
                                    <span class="label">工时</span>
                                    <span class="value">${r.duration} 分钟</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const finish = new Date(r.finishTime).getTime();
                    html += `
                        <div class="record-card done-card">
                            <div class="record-header">
                                <div class="record-model">${modelDisplay}</div>
                                <span class="status-badge status-done">✅ 已报工</span>
                            </div>
                            <div class="record-number" style="margin-bottom:6px;">${doneNumberDisplay}</div>
                            <div class="record-body">
                                <div class="row">
                                    <span class="label">开工时间</span>
                                    <span class="value">${formatTime(start)}</span>
                                </div>
                                <div class="row">
                                    <span class="label">报工完成</span>
                                    <span class="value">${formatTime(finish)}</span>
                                </div>
                                <div class="row">
                                    <span class="label">工时</span>
                                    <span class="value">${r.duration} 分钟</span>
                                </div>
                            </div>
                            <div class="record-footer">
                                <button class="btn btn-outline btn-sm" onclick="deleteRecord('${r.id}')">🗑 删除记录</button>
                            </div>
                        </div>
                    `;
                }
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // ================================================================
        //  工具函数
        // ================================================================

        /**
         * 根据开工时间、工时和全局浮动比例，计算报工窗口
         * @param {number} startTs  开工时间戳（ms）
         * @param {number} durationMin 工时（分钟）
         * @returns {{windowStart:number, windowEnd:number}}
         */
        function calcReportWindow(startTs, durationMin) {
            const durMs = durationMin * 60 * 1000;
            const ratio = windowPercent / 100;
            return {
                windowStart: startTs + durMs * (1 - ratio),
                windowEnd: startTs + durMs * (1 + ratio)
            };
        }

        function getStatus(now, windowStart, windowEnd) {
            if (now < windowStart) return 'waiting';
            if (now <= windowEnd) return 'ready';
            return 'overdue';
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function formatDuration(ms) {
            if (ms < 0) ms = -ms;
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${h}h${m}m`;
            if (m > 0) return `${m}m${s}s`;
            return `${s}s`;
        }

        // 百分比格式化：整数不显示小数，小数最多保留 1 位
        function formatPercent(p) {
            return Number.isInteger(p) ? `${p}%` : `${p.toFixed(1)}%`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        //  弹窗控制
        // ================================================================

        function openSettingsModal() {
            document.getElementById('jumpUrlInput').value = jumpUrl;
            document.getElementById('windowPercentInput').value = windowPercent;
            syncPresetChips();
            document.getElementById('settingsModal').classList.add('open');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('open');
        }

        // 点击遮罩关闭所有弹窗（含设置弹窗、提醒弹窗）
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('open');
                }
            });
        });

        // ================================================================
        //  Tab 切换
        // ================================================================

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const target = this.dataset.tab;
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(target).classList.add('active');

                if (target === 'tab-main') {
                    renderRecords();
                } else if (target === 'tab-models') {
                    renderModels();
                    renderModelSelect();
                }
            });
        });

        // ================================================================
        //  定时刷新
        // ================================================================

        let timer = null;

        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                const panel = document.getElementById('tab-main');
                if (panel.classList.contains('active')) {
                    renderRecords();
                }

                // 自动检查是否有「新」进入可报工状态的工件
                const popup = document.getElementById('readyPopup');
                if (popup && !popup.classList.contains('open')) {
                    checkAndShowReadyPopup(false);
                }
            }, 1000);
        }

        // ================================================================
        //  初始化
        // ================================================================

        function init() {
            loadData();
            renderModels();
            renderModelSelect();
            renderRecords();
            startTimer();

            document.getElementById('modelNameInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addModel();
            });
            document.getElementById('modelDurationInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addModel();
            });
            document.getElementById('workNumber').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startWork();
            });

            // 浮动比例输入框：实时高亮预设、回车保存
            const pctInput = document.getElementById('windowPercentInput');
            pctInput.addEventListener('input', syncPresetChips);
            pctInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveSettings();
            });
            document.getElementById('jumpUrlInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveSettings();
            });

            // 页面加载后，检查是否有已到报工时间的工件并弹窗提醒
            setTimeout(() => checkAndShowReadyPopup(true), 400);
        }

        init();
        console.log('✅ 报工助手（自定义浮动比例 + 可报工提醒 + 一键全报）已启动');
    </script>

</body>
</html>
